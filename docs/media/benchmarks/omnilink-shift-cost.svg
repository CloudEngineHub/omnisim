<title id="title">Estimated model cost per scored warehouse shift, lower is better</title>
<desc id="desc">Three primary scored shifts per system, failed checks included. OmniLink, Complete agent: $0.90; Lobster SDK, Basic robot tools: $1.33; LangGraph, Basic robot tools: $1.34; Plain model loop, Basic robot tools: $1.42; Lobster SDK, OmniLink’s tools: $1.76; Plain model loop, OmniLink’s tools: $2.18; LangGraph, OmniLink’s tools: $2.19. Original seven: Gemini 3.5 Flash. Codex and Claude Code are excluded from cost ranking because actual costs are unavailable; unranked usage estimates are separate. Infrastructure overhead is separate. Subscriptions, hosting and compute excluded.</desc>
