<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="836" viewBox="0 0 1000 836" role="img" aria-labelledby="title desc">
<title id="title">Warehouse-shift commitments kept by the tested configurations</title>
<desc id="desc">Mean commitments kept across three repeats of the same 30-minute shift. The original seven-configuration study was blind; the Codex and Claude Code extensions are retrospective. OmniLink, Complete agent: 89.9%; Claude Code, Opus 5.5 · high · Full tools: 80.8%; LangGraph, OmniLink’s tools: 78.8%; Codex, GPT-6.1 Sol · high · Full tools: 76.8%; Plain model loop, OmniLink’s tools: 75.8%; Lobster SDK, OmniLink’s tools: 61.7%; Plain model loop, Basic robot tools: 53.8%; Lobster SDK, Basic robot tools: 53.3%; LangGraph, Basic robot tools: 47.9%. Original seven used Gemini 3.5 Flash; Codex used GPT-6.1 Sol with high reasoning and Claude Code used Opus 5.5 with high effort in later retrospective tests. Timing conditions differed. 33 scored checks, simulated Husky in OmniSim. The original equal-tools result weakens when reply checks are excluded.</desc>
<rect width="1000" height="836" rx="18" fill="#151811"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#f5f4ed">
<text x="34" y="47" font-size="13" fill="#eadd78" letter-spacing="2">OMNILINK BENCHMARK · MEASURED IN OMNISIM</text>
<text x="34" y="86" font-size="29" font-weight="bold">Commitments kept across a 30-minute shift</text>
<text x="34" y="116" font-size="15" fill="#bbc2ae">Mean of three shifts · Different models; Codex and Claude Code tested later · Higher is better</text>
<line x1="300" y1="156" x2="300" y2="692" stroke="#34392e"/><text x="300" y="145" text-anchor="start" font-size="13" fill="#bbc2ae">0%</text>
<line x1="442.5" y1="156" x2="442.5" y2="692" stroke="#34392e"/><text x="442.5" y="145" text-anchor="middle" font-size="13" fill="#bbc2ae">25%</text>
<line x1="585" y1="156" x2="585" y2="692" stroke="#34392e"/><text x="585" y="145" text-anchor="middle" font-size="13" fill="#bbc2ae">50%</text>
<line x1="727.5" y1="156" x2="727.5" y2="692" stroke="#34392e"/><text x="727.5" y="145" text-anchor="middle" font-size="13" fill="#bbc2ae">75%</text>
<line x1="870" y1="156" x2="870" y2="692" stroke="#34392e"/><text x="870" y="145" text-anchor="end" font-size="13" fill="#bbc2ae">100%</text>
<text x="34" y="178" font-size="18" font-weight="bold" fill="#eadd78">OmniLink</text><text x="34" y="198" font-size="13" fill="#bbc2ae">Complete agent</text><rect x="300" y="166" width="512.43" height="26" rx="3" fill="#eadd78"/><text x="950" y="186" text-anchor="end" font-size="21" font-weight="bold" fill="#eadd78">89.9%</text>
<text x="34" y="237" font-size="18" font-weight="normal" fill="#f5f4ed">Claude Code</text><text x="34" y="257" font-size="13" fill="#bbc2ae">Opus 5.5 · high · Full tools</text><rect x="300" y="225" width="460.61" height="26" rx="3" fill="#d9a88f"/><text x="950" y="245" text-anchor="end" font-size="21" font-weight="bold" fill="#d9a88f">80.8%</text>
<text x="34" y="296" font-size="18" font-weight="normal" fill="#f5f4ed">LangGraph</text><text x="34" y="316" font-size="13" fill="#bbc2ae">OmniLink’s tools</text><rect x="300" y="284" width="449.16" height="26" rx="3" fill="#9fbaac"/><text x="950" y="304" text-anchor="end" font-size="21" font-weight="bold" fill="#9fbaac">78.8%</text>
<text x="34" y="355" font-size="18" font-weight="normal" fill="#f5f4ed">Codex</text><text x="34" y="375" font-size="13" fill="#bbc2ae">GPT-6.1 Sol · high · Full tools</text><rect x="300" y="343" width="437.58" height="26" rx="3" fill="#93b7d8"/><text x="950" y="363" text-anchor="end" font-size="21" font-weight="bold" fill="#93b7d8">76.8%</text>
<text x="34" y="414" font-size="18" font-weight="normal" fill="#f5f4ed">Plain model loop</text><text x="34" y="434" font-size="13" fill="#bbc2ae">OmniLink’s tools</text><rect x="300" y="402" width="432.06" height="26" rx="3" fill="#9fbaac"/><text x="950" y="422" text-anchor="end" font-size="21" font-weight="bold" fill="#9fbaac">75.8%</text>
<text x="34" y="473" font-size="18" font-weight="normal" fill="#f5f4ed">Lobster SDK</text><text x="34" y="493" font-size="13" fill="#bbc2ae">OmniLink’s tools</text><rect x="300" y="461" width="351.69" height="26" rx="3" fill="#9fbaac"/><text x="950" y="481" text-anchor="end" font-size="21" font-weight="bold" fill="#9fbaac">61.7%</text>
<text x="34" y="532" font-size="18" font-weight="normal" fill="#f5f4ed">Plain model loop</text><text x="34" y="552" font-size="13" fill="#bbc2ae">Basic robot tools</text><rect x="300" y="520" width="306.66" height="26" rx="3" fill="#929889"/><text x="950" y="540" text-anchor="end" font-size="21" font-weight="bold" fill="#929889">53.8%</text>
<text x="34" y="591" font-size="18" font-weight="normal" fill="#f5f4ed">Lobster SDK</text><text x="34" y="611" font-size="13" fill="#bbc2ae">Basic robot tools</text><rect x="300" y="579" width="303.81" height="26" rx="3" fill="#929889"/><text x="950" y="599" text-anchor="end" font-size="21" font-weight="bold" fill="#929889">53.3%</text>
<text x="34" y="650" font-size="18" font-weight="normal" fill="#f5f4ed">LangGraph</text><text x="34" y="670" font-size="13" fill="#bbc2ae">Basic robot tools</text><rect x="300" y="638" width="273.03" height="26" rx="3" fill="#929889"/><text x="950" y="658" text-anchor="end" font-size="21" font-weight="bold" fill="#929889">47.9%</text>
<text x="34" y="725" font-size="14" fill="#bbc2ae">33 scored checks · Simulation only · Original seven: Gemini 3.5 Flash · September 27, 2026</text>
<text x="34" y="750" font-size="13" fill="#bbc2ae">Original equal-tools lead weakens without reply checks. Results describe these tested configurations.</text>
<text x="34" y="774" font-size="13" fill="#bbc2ae">Codex: GPT-6.1 Sol, high reasoning · Claude Code: Opus 5.5, high effort · September 30, 2026</text>
<text x="34" y="798" font-size="13" fill="#bbc2ae">Later retrospective tests. Claude ran closer to real time; differences do not establish statistical superiority.</text>
</g></svg>
